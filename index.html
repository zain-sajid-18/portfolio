    <style>
      :root {
        color-scheme: dark;
        --bg: #08090b;
        --panel: rgba(18, 22, 27, 0.82);
        --panel-strong: #11161c;
        --text: #f3f7fb;
        --muted: #aab5c0;
        --soft: #707b86;
        --line: rgba(255, 255, 255, 0.1);
        --blue: #74a7ff;
        --green: #5be0ad;
        --rose: #ff8c9f;
        --amber: #ffd166;
        --radius: 8px;
        --max: 1180px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 20% 0%, rgba(116, 167, 255, 0.18), transparent 28rem),
          radial-gradient(circle at 88% 18%, rgba(91, 224, 173, 0.11), transparent 24rem),
          linear-gradient(180deg, #08090b 0%, #0c1014 48%, #08090b 100%);
        color: var(--text);
        font-family: Geist, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: linear-gradient(to bottom, black, transparent 70%);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      .shell {
        width: min(var(--max), calc(100% - 40px));
        margin: 0 auto;
      }

      .nav {
        position: fixed;
        z-index: 50;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        width: min(var(--max), calc(100% - 28px));
        height: 62px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px 0 18px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: rgba(9, 12, 16, 0.82);
        backdrop-filter: blur(18px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
      }

      .mark {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 7px;
        background: linear-gradient(135deg, var(--blue), var(--green));
        color: #061016;
        font-weight: 800;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .nav-links a,
      .ghost-btn,
      .primary-btn {
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 7px;
        padding: 0 14px;
        color: var(--muted);
        border: 1px solid transparent;
        transition: transform 180ms ease, color 180ms ease, border-color 180ms ease, background 180ms ease;
      }

      .nav-links a:hover,
      .ghost-btn:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.06);
        border-color: var(--line);
      }

      .primary-btn {
        color: #071018;
        border-color: rgba(255, 255, 255, 0.22);
        background: linear-gradient(135deg, var(--blue), var(--green));
        font-weight: 700;
      }

      .primary-btn:hover,
      .ghost-btn:hover {
        transform: translateY(-2px);
      }

      .mobile-menu {
        display: none;
        background: transparent;
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 7px;
        width: 42px;
        height: 42px;
      }

      .hero {
        position: relative;
        min-height: 100svh;
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
        align-items: center;
        gap: 44px;
        padding: 112px 0 56px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
        color: var(--green);
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        text-transform: uppercase;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: currentColor;
        box-shadow: 0 0 16px currentColor;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        max-width: 740px;
        font-size: clamp(40px, 5.4vw, 66px);
        line-height: 0.96;
        letter-spacing: 0;
      }

      .gradient-text {
        background: linear-gradient(135deg, #ffffff, var(--blue) 42%, var(--green));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .lead {
        margin-top: 22px;
        max-width: 650px;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.7;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 30px;
      }

      .hero-metrics {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 34px;
        max-width: 640px;
      }

      .metric,
      .card,
      .project-card,
      .contact-panel,
      .timeline-item {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--panel);
        backdrop-filter: blur(16px);
      }

      .metric {
        padding: 16px;
      }

      .metric strong {
        display: block;
        font-size: 26px;
      }

      .metric span {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.35;
      }

      .visual-stage {
        position: relative;
        min-height: 560px;
      }

      #hero-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .portrait-card {
        position: absolute;
        right: 0;
        bottom: 40px;
        width: min(390px, 92%);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.04));
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45);
      }

      .portrait {
        aspect-ratio: 4 / 5;
        position: relative;
        display: grid;
        place-items: center;
        background:
          linear-gradient(135deg, rgba(116, 167, 255, 0.2), transparent),
          radial-gradient(circle at 50% 22%, rgba(91, 224, 173, 0.28), transparent 34%),
          #10161c;
      }

      .avatar-orbit {
        width: 210px;
        height: 210px;
        position: relative;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 50%;
        animation: float 5.2s ease-in-out infinite;
      }

      .avatar-orbit::before {
        content: "ZS";
        position: absolute;
        inset: 34px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: linear-gradient(135deg, #dce9ff, #7df1c3);
        color: #071018;
        font-size: 54px;
        font-weight: 800;
      }

      .avatar-orbit::after {
        content: "";
        position: absolute;
        inset: -18px;
        border-radius: 50%;
        border: 1px dashed rgba(255, 255, 255, 0.2);
        animation: spin 18s linear infinite;
      }

      .portrait-meta {
        display: grid;
        gap: 10px;
        padding: 18px;
        background: rgba(8, 11, 15, 0.88);
      }

      .mini-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        color: var(--muted);
        font-size: 14px;
      }

      .mini-row strong {
        color: var(--text);
        min-width: 0;
        overflow-wrap: anywhere;
        text-align: right;
      }

      .section {
        padding: 86px 0;
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 24px;
        margin-bottom: 28px;
      }

      .section h2 {
        font-size: clamp(30px, 4vw, 48px);
        line-height: 1.05;
      }

      .section-copy {
        max-width: 570px;
        color: var(--muted);
        line-height: 1.65;
      }

      .about-grid {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 18px;
      }

      .card {
        padding: 24px;
      }

      .card h3,
      .project-card h3,
      .timeline-item h3 {
        font-size: 22px;
        margin-bottom: 12px;
      }

      .card p,
      .project-card p,
      .timeline-item p {
        color: var(--muted);
        line-height: 1.62;
      }

      .skill-cloud {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.045);
        color: var(--muted);
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
      }

      .chip::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--blue);
      }

      .project-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .project-card {
        overflow: hidden;
        transition: transform 220ms ease, border-color 220ms ease;
      }

      .project-card:hover {
        transform: translateY(-5px);
        border-color: rgba(116, 167, 255, 0.42);
      }

      .project-art {
        height: 230px;
        position: relative;
        overflow: hidden;
        border-bottom: 1px solid var(--line);
        background: #111820;
      }

      .project-art img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.78;
        filter: saturate(1.05) contrast(1.05);
        transform: scale(1.01);
        transition: transform 520ms ease, opacity 520ms ease;
      }

      .project-card:hover img {
        transform: scale(1.08);
        opacity: 0.94;
      }

      .project-art::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(8, 9, 11, 0.82), transparent 58%);
      }

      .project-body {
        padding: 22px;
      }

      .project-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 18px 0 0;
      }

      .impact-list {
        display: grid;
        gap: 10px;
        margin-top: 18px;
      }

      .impact-list li {
        color: var(--muted);
        line-height: 1.55;
      }

      .timeline {
        display: grid;
        gap: 14px;
      }

      .timeline-item {
        padding: 22px;
        display: grid;
        grid-template-columns: 170px 1fr;
        gap: 22px;
      }

      .timeline-date {
        color: var(--green);
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
      }

      .contact-grid {
        display: grid;
        grid-template-columns: 0.92fr 1.08fr;
        gap: 18px;
      }

      .contact-panel {
        padding: 24px;
      }

      .contact-link {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        padding: 16px 0;
        border-bottom: 1px solid var(--line);
      }

      .contact-link:last-child {
        border-bottom: 0;
      }

      .contact-link span {
        color: var(--muted);
        font-size: 14px;
      }

      .form {
        display: grid;
        gap: 14px;
      }

      .form-row {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.045);
        color: var(--text);
        padding: 13px 14px;
        outline: none;
      }

      textarea {
        resize: vertical;
        min-height: 134px;
      }

      input:focus,
      textarea:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(116, 167, 255, 0.14);
      }

      .footer {
        padding: 28px 0 42px;
        color: var(--soft);
        border-top: 1px solid var(--line);
      }

      .footer .shell {
        display: flex;
        justify-content: space-between;
        gap: 20px;
      }

      .reveal {
        opacity: 0;
        transform: translateY(18px);
        transition: opacity 700ms ease, transform 700ms ease;
      }

      .reveal.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-14px);
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.001ms !important;
        }
      }

      @media (max-width: 900px) {
        .nav-links {
          position: absolute;
          top: 70px;
          left: 0;
          right: 0;
          display: none;
          flex-direction: column;
          align-items: stretch;
          padding: 12px;
          border: 1px solid var(--line);
          border-radius: var(--radius);
          background: rgba(9, 12, 16, 0.96);
        }

        .nav-links.open {
          display: flex;
        }

        .mobile-menu {
          display: inline-grid;
          place-items: center;
        }

        .hero,
        .about-grid,
        .contact-grid {
          grid-template-columns: 1fr;
        }

        .hero {
          padding-top: 104px;
        }

        .visual-stage {
          min-height: 470px;
          order: -1;
        }

        .portrait-card {
          left: 50%;
          right: auto;
          transform: translateX(-50%);
        }

        .portrait-card.reveal.is-visible {
          transform: translateX(-50%);
        }

        .project-grid,
        .hero-metrics,
        .form-row {
          grid-template-columns: 1fr;
        }

        .section-head {
          align-items: start;
          flex-direction: column;
        }

        .timeline-item {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 540px) {
        .shell {
          width: min(100% - 28px, var(--max));
        }

        .nav {
          top: 10px;
          width: calc(100% - 20px);
        }

        .brand span:last-child {
          display: none;
        }

        .hero-actions a {
          width: 100%;
        }
      }
    </style>
  </head>

      function Icon({ children }) {
        return <span aria-hidden="true">{children}</span>;
      }

      function HeroCanvas() {
        const mountRef = useRef(null);

        useEffect(() => {
          if (!window.THREE || !mountRef.current) return;

          const mount = mountRef.current;
          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(48, mount.clientWidth / mount.clientHeight, 0.1, 100);
          camera.position.set(0, 0, 8);

          const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          renderer.setSize(mount.clientWidth, mount.clientHeight);
          mount.appendChild(renderer.domElement);

          const group = new THREE.Group();
          scene.add(group);

          const geometry = new THREE.IcosahedronGeometry(1.8, 2);
          const material = new THREE.MeshStandardMaterial({
            color: 0x74a7ff,
            metalness: 0.55,
            roughness: 0.22,
            wireframe: true,
          });
          const core = new THREE.Mesh(geometry, material);
          group.add(core);

          const ringMaterial = new THREE.MeshBasicMaterial({ color: 0x5be0ad, transparent: true, opacity: 0.46 });
          [2.4, 3.05, 3.65].forEach((radius, index) => {
            const ring = new THREE.Mesh(new THREE.TorusGeometry(radius, 0.01, 16, 140), ringMaterial);
            ring.rotation.x = Math.PI / (2.2 + index * 0.22);
            ring.rotation.y = Math.PI / (3.2 + index * 0.18);
            group.add(ring);
          });

          const particles = new THREE.BufferGeometry();
          const positions = [];
          for (let i = 0; i < 260; i++) {
            positions.push((Math.random() - 0.5) * 9, (Math.random() - 0.5) * 7, (Math.random() - 0.5) * 7);
          }
          particles.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
          const particleMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.018, transparent: true, opacity: 0.55 });
          const points = new THREE.Points(particles, particleMaterial);
          scene.add(points);

          const key = new THREE.PointLight(0x74a7ff, 2.7, 20);
          key.position.set(4, 3, 5);
          scene.add(key);
          const fill = new THREE.PointLight(0x5be0ad, 1.4, 14);
          fill.position.set(-4, -2, 4);
          scene.add(fill);
          scene.add(new THREE.AmbientLight(0xffffff, 0.55));

          let animationFrame;
          const animate = () => {
            group.rotation.y += 0.004;
            group.rotation.x = Math.sin(Date.now() * 0.0006) * 0.18;
            points.rotation.y -= 0.0015;
            renderer.render(scene, camera);
            animationFrame = requestAnimationFrame(animate);
          };
          animate();

          const resize = () => {
            if (!mount.clientWidth || !mount.clientHeight) return;
            camera.aspect = mount.clientWidth / mount.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(mount.clientWidth, mount.clientHeight);
          };
          window.addEventListener("resize", resize);

          return () => {
            cancelAnimationFrame(animationFrame);
            window.removeEventListener("resize", resize);
            renderer.dispose();
            geometry.dispose();
            material.dispose();
            mount.removeChild(renderer.domElement);
          };
        }, []);

        return <div id="hero-canvas" ref={mountRef} aria-hidden="true" />;
      }

      function App() {
        const [menuOpen, setMenuOpen] = useState(false);

        useEffect(() => {
          const observer = new IntersectionObserver(
            entries => {
              entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add("is-visible");
              });
            },
            { threshold: 0.12 }
          );

          document.querySelectorAll(".reveal").forEach(el => observer.observe(el));
          return () => observer.disconnect();
        }, []);

        const handleSubmit = event => {
          event.preventDefault();
          const data = new FormData(event.currentTarget);
          const subject = encodeURIComponent(data.get("subject") || "Portfolio inquiry");
          const body = encodeURIComponent(
            `Name: ${data.get("name")}\nEmail: ${data.get("email")}\n\n${data.get("message")}`
          );
          window.location.href = `mailto:zainsajid.056@gmail.com?subject=${subject}&body=${body}`;
        };

        return (
          <>
